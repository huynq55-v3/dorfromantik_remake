[package]
name = "dorfromantik_remake"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

crossbeam-channel = "0.5"
wgpu = "24.0"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
mimalloc = "0.1"
bincode = "1.3"
matrixmultiply = "0.3"

[[bin]]
name = "simulator"
path = "bin/simulator.rs"

[[bin]]
name = "replay"
path = "bin/replay.rs"

[[bin]]
name = "train_alphazero_gpu"
path = "bin/train_alphazero_gpu.rs"

[[bin]]
name = "evolve_heuristic"
path = "bin/evolve_heuristic.rs"

[[bin]]
name = "gen_dataset_real_score"
path = "bin/gen_dataset_real_score.rs"

[[bin]]
name = "train_nnue_real_score"
path = "bin/train_nnue_real_score.rs"

[[bin]]
name = "play_nnue_beam"
path = "bin/play_nnue_beam.rs"

[[bin]]
name = "gen_dataset_gnn_selfplay"
path = "bin/gen_dataset_gnn_selfplay.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
