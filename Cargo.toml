[package]
name = "dorfromantik_remake"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "simulator"
path = "bin/simulator.rs"

[[bin]]
name = "replay"
path = "bin/replay.rs"

[[bin]]
name = "rl_benchmark"
path = "bin/rl_benchmark.rs"

[[bin]]
name = "train"
path = "bin/train.rs"

[[bin]]
name = "train_alphazero"
path = "bin/train_alphazero.rs"

[[bin]]
name = "debug_seed"
path = "bin/debug_seed.rs"
